# Нептун: ПОИСК адреса и скорости RS-485 (временная прошивка)
# Что делает по кругу:
#   1) по 3 с слушает линию на каждой скорости — вдруг Нептун сам что-то шлёт;
#   2) опрашивает адреса 1…247 на каждой скорости (Modbus, чтение регистра 0).
# Любой ответ (даже «ошибка Modbus») = Нептун найден.
# Результат: строка «Найдено» на странице http://192.168.1.77 и жёлтые строки [scan] в журнале.
# Круг ≈ 6–7 минут, потом начинается заново (можно поменять A/B местами и ждать следующий круг).
# Провода те же, что в neptun.yaml. После поиска прошить обратно neptun.yaml с найденными адресом и скоростью.
# По документации Нептун Base RS: адрес 1, 9600 8N1, HR0 = 0x4E42. Ответ с 4E 42 — точно Нептун.
# «Принято байт» на странице: если за круг 0 — с линии не пришло вообще ничего (провода, питание, пины),
# если байты есть, а «Найдено» пусто — линия живая, но скорость/чётность не те или помехи.
# Если 0 байт — поменяйте местами tx_pin/rx_pin ниже и прошейте снова (перепаивать не нужно).

substitutions:
  tx_pin: GPIO21
  rx_pin: GPIO20

esphome:
  name: neptun
  friendly_name: Нептун

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG   # журнал только в USB, не на GPIO20/21 (линию RS-485)

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB
  ap:
    ssid: "Neptun-Setup"
    password: !secret ap_password

captive_portal:

ota:
  - platform: esphome
  - platform: web_server

web_server:
  port: 80
  version: 3
  local: true

uart:
  id: rs485
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 9600
  rx_buffer_size: 512

text_sensor:
  - platform: template
    id: scan_state
    name: "Поиск: сейчас"
    update_interval: never
  - platform: template
    id: found_txt
    name: "Найдено"
    update_interval: never
  - platform: template
    id: rx_txt
    name: "Принято байт"
    update_interval: never

button:
  - {platform: restart, name: "Перезагрузка"}

interval:
  - interval: 150ms
    then:
      - lambda: |-
          struct Cfg { uint32_t baud; bool even; };
          static const Cfg cfgs[] = {
            {9600, false}, {19200, false}, {4800, false}, {38400, false},
            {57600, false}, {115200, false}, {2400, false}, {1200, false}, {9600, true}, {19200, true}};
          static const int NC = sizeof(cfgs) / sizeof(cfgs[0]);
          static int phase = 0;        // 0 = слушаем, 1 = опрашиваем адреса
          static int ci = 0;           // какие настройки сейчас
          static int addr = 0;         // последний опрошенный адрес
          static bool applied = false;
          static uint32_t t0 = 0;
          static uint8_t req[8];
          static bool heard[NC] = {false};
          static int found = 0;
          static std::string found_list;
          static int round_no = 1;
          static uint32_t rx_round = 0;   // байт за текущий круг
          static uint32_t rx_total = 0;   // байт с момента включения
          static uint32_t rx_shown = 0xFFFFFFFF;

          auto crc16 = [](const uint8_t *d, int len) -> uint16_t {
            uint16_t c = 0xFFFF;
            for (int i = 0; i < len; i++) {
              c ^= d[i];
              for (int j = 0; j < 8; j++) c = (c & 1) ? (c >> 1) ^ 0xA001 : (c >> 1);
            }
            return c;
          };
          auto cfg_name = [&](int i) -> std::string {
            char s[24];
            snprintf(s, sizeof(s), "%u %s", (unsigned) cfgs[i].baud, cfgs[i].even ? "8E1" : "8N1");
            return std::string(s);
          };
          auto add_found = [&](const std::string &what) {
            if (found >= 10) return;
            found++;
            found_list += what + "; ";
            id(found_txt).publish_state(found_list);
          };

          // 1. Забираем всё, что пришло с линии после прошлого шага
          uint8_t buf[64];
          int n = 0;
          while (id(rs485).available() && n < 64) id(rs485).read_byte(&buf[n++]);
          rx_round += n;
          rx_total += n;
          if (rx_total != rx_shown && (rx_total - rx_shown > 50 || rx_shown == 0xFFFFFFFF || n > 0)) {
            rx_shown = rx_total;
            id(rx_txt).publish_state("круг " + std::to_string(round_no) + ": " + std::to_string(rx_round) +
                                     ", всего: " + std::to_string(rx_total));
          }

          // 2. Переключение скорости
          if (!applied) {
            id(rs485).set_baud_rate(cfgs[ci].baud);
            id(rs485).set_parity(cfgs[ci].even ? uart::UART_CONFIG_PARITY_EVEN : uart::UART_CONFIG_PARITY_NONE);
            id(rs485).load_settings(false);
            uint8_t b;
            while (id(rs485).available()) id(rs485).read_byte(&b);
            applied = true;
            t0 = millis();
            addr = 0;
            id(scan_state).publish_state("Круг " + std::to_string(round_no) + ": " +
                                         (phase == 0 ? "слушаю " : "опрашиваю ") + cfg_name(ci));
            return;
          }

          // 3. Разбираем пришедшие байты
          if (n > 0) {
            std::string hex;
            char t[4];
            for (int i = 0; i < n; i++) { snprintf(t, sizeof(t), "%02X ", buf[i]); hex += t; }
            if (phase == 0) {
              ESP_LOGW("scan", "Нептун сам шлёт данные на %s: %s", cfg_name(ci).c_str(), hex.c_str());
              if (!heard[ci]) { heard[ci] = true; add_found("сам шлёт на " + cfg_name(ci)); }
            } else if (n == 8 && memcmp(buf, req, 8) == 0) {
              ESP_LOGI("scan", "Эхо своего запроса (не ответ)");
            } else {
              bool crc_ok = n >= 5 && crc16(buf, n - 2) == (uint16_t) (buf[n - 2] | (buf[n - 1] << 8));
              ESP_LOGW("scan", "ОТВЕТ на адрес %d, %s, CRC %s: %s", addr, cfg_name(ci).c_str(),
                       crc_ok ? "OK" : "плохой", hex.c_str());
              bool is_neptun = crc_ok && n == 7 && buf[1] == 0x03 && buf[3] == 0x4E && buf[4] == 0x42;
              if (crc_ok) add_found("адрес " + std::to_string(buf[0]) + ", " + cfg_name(ci) +
                                    (is_neptun ? " (Нептун Base, 4E42)" : ""));
            }
          }

          // 4. Следующий шаг
          if (phase == 0) {
            if (millis() - t0 > 3000) {
              applied = false;
              if (++ci >= NC) { ci = 0; phase = 1; }
            }
            return;
          }
          if (++addr > 247) {
            applied = false;
            if (++ci >= NC) {
              ESP_LOGW("scan", "Круг %d закончен. Принято байт: %u. Найдено: %s", round_no,
                       (unsigned) rx_round, found ? found_list.c_str() : "ничего");
              if (!found) id(found_txt).publish_state("пока ничего (круг " + std::to_string(round_no) + ")");
              ci = 0;
              phase = 0;
              round_no++;
              rx_round = 0;
            }
            return;
          }
          req[0] = addr; req[1] = 0x03; req[2] = 0x00; req[3] = 0x00; req[4] = 0x00; req[5] = 0x01;
          uint16_t c = crc16(req, 6);
          req[6] = c & 0xFF;
          req[7] = c >> 8;
          id(rs485).write_array(req, 8);
          if (addr % 50 == 1)
            id(scan_state).publish_state("Круг " + std::to_string(round_no) + ": " + cfg_name(ci) +
                                         ", адрес " + std::to_string(addr));
