<text x="817.5" y="664" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">Котёл Protherm (MEK21_3)</text>
<text x="817.5" y="684" font-size="12" text-anchor="middle" fill="#444">колодка RT24V: СНЯТЬ перемычку,</text>
<text x="817.5" y="701" font-size="12" text-anchor="middle" fill="#444">подключить COM и NO реле 8</text>
<text x="20" y="778" font-size="14" text-anchor="start" fill="#7b1fa2" font-weight="bold">⚠ На RT24V НЕЛЬЗЯ подавать 220 В — это сухой контакт.</text>
<text x="20" y="796" font-size="13" text-anchor="start" fill="#7b1fa2">Вернуть перемычку на RT24V = котёл работает как раньше, без платы.</text>
<rect x="820" y="90" width="260" height="110" rx="8" fill="#fffde7" stroke="#9e9d24" stroke-width="2"/>
