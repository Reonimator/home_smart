<text x="950.0" y="132" font-size="12" text-anchor="middle" fill="#444">7 × NTC 10 кОм → ADS1115</text>
<text x="950.0" y="149" font-size="12" text-anchor="middle" fill="#444">провода отдельно от 220 В,</text>
<text x="950.0" y="166" font-size="12" text-anchor="middle" fill="#444">не в одной гофре с силовыми</text>
