# Нептун для esp.bat: пароли из secrets.yaml, вся конфигурация — в neptun_base.yaml.
# На домашнем сервере используется тот же neptun_base.yaml прямо с GitHub, см. docs/server.md.
substitutions:
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  ap_password: !secret ap_password

packages:
  base: !include neptun_base.yaml
