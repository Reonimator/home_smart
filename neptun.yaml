# Нептун Base RS ↔ ESP32-C3 SuperMini + XY-017 (RS-485, Modbus RTU)
# ТЕСТОВАЯ прошивка: читает ячейки Нептуна и даёт кнопку кранов на веб-странице.
# Карта регистров взята у похожей системы защиты от протечек (Яндекс) — проверяем, совпадает ли.
# Связь с экраном (режим «Ушёл» → закрыть воду) включим ПОСЛЕ проверки.
#
# Подключение:
#   XY-017 VCC → 3V3, GND → GND, TXD → GPIO20 (RX), RXD → GPIO21 (TX)
#   XY-017 A+ → Нептун D+, B- → Нептун D-, GND → Нептун GNDRS
#   Питание ESP32-C3: 5V и GND с разъёма прошивки платы реле

esphome:
  name: neptun
  friendly_name: Нептун

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB   # у SuperMini слабая антенна: на полной мощности Wi-Fi часто отваливается
  ap:
    ssid: "Neptun-Setup"
    password: !secret ap_password

captive_portal:

ota:
  - platform: esphome
  - platform: web_server

web_server:
  port: 80
  version: 3
  local: true

uart:
  id: rs485
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

modbus:
  id: mb
  uart_id: rs485

modbus_controller:
  - id: nep
    modbus_id: mb
    address: 1
    update_interval: 5s
    command_throttle: 100ms

# --- Сырые ячейки: смотрим, что вообще отвечает Нептун ---
sensor:
  - {platform: modbus_controller, modbus_controller_id: nep, name: "HR0 адрес Modbus", register_type: holding, address: 0, value_type: U_WORD, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: nep, name: "HR1 скорость", register_type: holding, address: 1, value_type: U_WORD, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: nep, name: "HR3 таймаут кранов", register_type: holding, address: 3, value_type: U_WORD, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: nep, name: "HR4 линия 1 режим", register_type: holding, address: 4, value_type: U_WORD, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: nep, name: "HR5 линия 2 режим", register_type: holding, address: 5, value_type: U_WORD, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: nep, name: "IR3 состояние линий кранов", register_type: read, address: 3, value_type: U_WORD, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: nep, name: "IR4 протечка по датчикам (биты)", register_type: read, address: 4, value_type: U_WORD, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: nep, name: "IR8 ошибки", register_type: read, address: 8, value_type: U_WORD, accuracy_decimals: 0}
  - {platform: wifi_signal, name: "Wi-Fi сигнал", update_interval: 60s}

binary_sensor:
  - {platform: modbus_controller, modbus_controller_id: nep, name: "Протечка", register_type: coil, address: 0, device_class: moisture}
  - {platform: modbus_controller, modbus_controller_id: nep, name: "Краны открыты", register_type: coil, address: 1, device_class: opening}
  - {platform: modbus_controller, modbus_controller_id: nep, name: "Питание кранов", register_type: discrete_input, address: 0}

switch:
  # Вкл = открыть краны, Выкл = закрыть (coil 0x0001)
  - platform: modbus_controller
    modbus_controller_id: nep
    id: valves
    name: "Краны (вкл = открыть)"
    register_type: coil
    address: 1

button:
  - {platform: restart, name: "Перезагрузка"}
