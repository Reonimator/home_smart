# ---------- Связь с настенным экраном (UDP в домашней сети) ----------
udp:

packet_transport:
  - platform: udp
    update_interval: 1s
    sensors: [t1, t2, t3, t4, t5, t6, t7]
    binary_sensors: [h1, h2, h3, h4, h5, h6, h7, h8]
    providers:
      - name: ekran

binary_sensor:
  - {platform: template, id: h1, internal: true, lambda: 'return id(r1).state;'}
  - {platform: template, id: h2, internal: true, lambda: 'return id(r2).state;'}
  - {platform: template, id: h3, internal: true, lambda: 'return id(r3).state;'}
  - {platform: template, id: h4, internal: true, lambda: 'return id(r4).state;'}
  - {platform: template, id: h5, internal: true, lambda: 'return id(r5).state;'}
  - {platform: template, id: h6, internal: true, lambda: 'return id(r6).state;'}
  - {platform: template, id: h7, internal: true, lambda: 'return id(r7).state;'}
  - {platform: template, id: h8, internal: true, lambda: 'return id(r8).state;'}

# ---------- Реле ----------
switch:
  - {platform: gpio, pin: GPIO16, name: "Реле 1 Балкон",   id: r1, restore_mode: ALWAYS_OFF, internal: true}
  - {platform: gpio, pin: GPIO14, name: "Реле 2 Кухня",   id: r2, restore_mode: ALWAYS_OFF, internal: true}
  - {platform: gpio, pin: GPIO12, name: "Реле 3 Детская", id: r3, restore_mode: ALWAYS_OFF, internal: true}
  - {platform: gpio, pin: GPIO13, name: "Реле 4 Спальня",  id: r4, restore_mode: ALWAYS_OFF, internal: true}
  - {platform: gpio, pin: GPIO15, name: "Реле 5 Коридор",  id: r5, restore_mode: ALWAYS_OFF, internal: true}
  - {platform: gpio, pin: GPIO0,  name: "Реле 6 Ванная",  id: r6, restore_mode: ALWAYS_OFF, internal: true}
  - {platform: gpio, pin: GPIO4,  name: "Реле 7 Туалет",   id: r7, restore_mode: ALWAYS_OFF, internal: true}
  - {platform: gpio, pin: GPIO5,  name: "Реле 8 Котёл",    id: r8, restore_mode: ALWAYS_OFF, internal: true}

# ---------- Термостаты зон ----------
# Сервопривод открывается не чаще раза в 5 минут (бережём привод),
# гистерезис ±0,5 °C. Если датчик оборван — зона просто не греет.
climate:
  - platform: thermostat
    id: c1
    name: "1 Балкон"
    internal: true
    sensor: t1
    min_heating_off_time: 300s
    min_heating_run_time: 300s
    min_idle_time: 30s
    heat_deadband: 0.5
    heat_overrun: 0.5
    heat_action: {switch.turn_on: r1}
    idle_action: {switch.turn_off: r1}
    visual: {min_temperature: 15, max_temperature: 35, temperature_step: 0.5}
    default_preset: Home
    on_boot_restore_from: memory
    preset: [{name: Home, default_target_temperature_low: 24, mode: HEAT}]

  - platform: thermostat
    id: c2
    name: "2 Кухня"
    internal: true
    sensor: t2
