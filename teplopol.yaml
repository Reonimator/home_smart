# ---------- Статус датчиков (видно сразу на странице) ----------
text_sensor:
  - platform: template
    id: sensors_status
    name: "Состояние датчиков"
    update_interval: never

  # Сводка по зоне одной строкой: пол, сопротивление датчика, цель, реле
  - platform: template
    name: "Зона 1 Балкон"
    update_interval: 15s
    lambda: |-
      char b[96];
      snprintf(b, sizeof(b), "%.1f° | %.0f Ом | цель %.1f° | %s",
               id(t1).state, id(res1).state, id(c1).target_temperature,
               id(r1).state ? "греет" : "закрыто");
      return std::string(b);
  - platform: template
