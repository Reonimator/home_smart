# ---------- Котёл ----------
# Включается через 3 минуты после того, как открылась хоть одна зона
# (сервоприводам нужно время открыться), выключается сразу,
# когда все зоны закрыты.
globals:
  - id: heat_since
    type: uint32_t
    initial_value: '0'

interval:
  - interval: 5s
    then:
      - lambda: |-
          // Защита: датчик оборван (NA) -> зона закрыта
          if (isnan(id(t1).state) && id(r1).state) id(r1).turn_off();
          if (isnan(id(t2).state) && id(r2).state) id(r2).turn_off();
          if (isnan(id(t3).state) && id(r3).state) id(r3).turn_off();
          if (isnan(id(t4).state) && id(r4).state) id(r4).turn_off();
          if (isnan(id(t5).state) && id(r5).state) id(r5).turn_off();
          if (isnan(id(t6).state) && id(r6).state) id(r6).turn_off();
          if (isnan(id(t7).state) && id(r7).state) id(r7).turn_off();
          std::string bad = "";
          if (isnan(id(t1).state)) bad += "Балкон ";
          if (isnan(id(t2).state)) bad += "Кухня ";
          if (isnan(id(t3).state)) bad += "Детская ";
          if (isnan(id(t4).state)) bad += "Спальня ";
          if (isnan(id(t5).state)) bad += "Коридор ";
          if (isnan(id(t6).state)) bad += "Ванная ";
          if (isnan(id(t7).state)) bad += "Туалет ";
          std::string st = bad.empty() ? "OK" : ("ОБРЫВ: " + bad);
          if (id(sensors_status).state != st) id(sensors_status).publish_state(st);
          bool any = id(r1).state || id(r2).state || id(r3).state || id(r4).state
                  || id(r5).state || id(r6).state || id(r7).state;
          uint32_t now = millis();
          if (any) {
            if (id(heat_since) == 0) id(heat_since) = now == 0 ? 1 : now;
            if (now - id(heat_since) > 180000 && !id(r8).state) id(r8).turn_on();
          } else {
            id(heat_since) = 0;
            if (id(r8).state) id(r8).turn_off();
          }

button:
  - platform: restart
    name: "Перезагрузка"
