esphome:
  name: teplopol
  platformio_options:
    board_build.flash_mode: dout

esp8266:
  board: esp01_1m
  restore_from_flash: true

preferences:
  flash_write_interval: 2min

logger:
  baud_rate: 0
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Teplopol-Setup"
    password: !secret ap_password

captive_portal:

ota:
  - platform: esphome
  - platform: web_server

# Версия 1 — самая лёгкая страница. Даже она с ~30 сущностями обрывалась
# на ESP8266 (не хватало памяти: таблица кончалась на датчиках, скрипт не
# догружался, значения пустые). Поэтому на странице только сводка по зонам
# (по строке на зону) — термостаты, реле и датчики скрыты (internal), но
# работают как прежде. Управление — с экрана. Оформление v1 берётся с esphome.io.
web_server:
  port: 80
  version: 1

i2c:
  sda: GPIO2
  scl: GPIO3
  scan: true

ads1115:
  - address: 0x48
    id: ads1
  - address: 0x49
    id: ads2

# ---------- Датчики пола: напряжение -> сопротивление -> °C ----------
sensor:
  # 1 Балкон (плата 1, A0)
  - {platform: ads1115, ads1115_id: ads1, multiplexer: A0_GND, gain: 4.096, id: v1, update_interval: 15s, internal: true}
  - {platform: resistance, sensor: v1, configuration: UPSTREAM, resistor: 10kOhm, reference_voltage: 3.3V, id: res1, internal: true}
  - platform: ntc
    sensor: res1
    id: t1
    name: "Пол 1 Балкон"
    internal: true
    calibration:   # таблица из паспорта Valtec VT.AC602 (B≈3330, не 3950)
      - 22.07kOhm -> 5°C
      - 12.091kOhm -> 20°C
      - 5.827kOhm -> 40°C
    filters:
      - sliding_window_moving_average: {window_size: 3, send_every: 1}
      - lambda: 'return (x < 5 || x > 45) ? NAN : x;'

  # 2 Кухня (плата 1, A1)
  - {platform: ads1115, ads1115_id: ads1, multiplexer: A1_GND, gain: 4.096, id: v2, update_interval: 15s, internal: true}
  - {platform: resistance, sensor: v2, configuration: UPSTREAM, resistor: 10kOhm, reference_voltage: 3.3V, id: res2, internal: true}
  - platform: ntc
    sensor: res2
    id: t2
    name: "Пол 2 Кухня"
    internal: true
    calibration:   # таблица из паспорта Valtec VT.AC602 (B≈3330, не 3950)
      - 22.07kOhm -> 5°C
      - 12.091kOhm -> 20°C
      - 5.827kOhm -> 40°C
    filters:
      - sliding_window_moving_average: {window_size: 3, send_every: 1}
      - lambda: 'return (x < 5 || x > 45) ? NAN : x;'

  # 3 Детская (плата 1, A2)
  - {platform: ads1115, ads1115_id: ads1, multiplexer: A2_GND, gain: 4.096, id: v3, update_interval: 15s, internal: true}
  - {platform: resistance, sensor: v3, configuration: UPSTREAM, resistor: 10kOhm, reference_voltage: 3.3V, id: res3, internal: true}
  - platform: ntc
    sensor: res3
    id: t3
    name: "Пол 3 Детская"
    internal: true
    calibration:   # таблица из паспорта Valtec VT.AC602 (B≈3330, не 3950)
      - 22.07kOhm -> 5°C
      - 12.091kOhm -> 20°C
      - 5.827kOhm -> 40°C
    filters:
      - sliding_window_moving_average: {window_size: 3, send_every: 1}
      - lambda: 'return (x < 5 || x > 45) ? NAN : x;'

  # 4 Спальня (плата 1, A3)
  - {platform: ads1115, ads1115_id: ads1, multiplexer: A3_GND, gain: 4.096, id: v4, update_interval: 15s, internal: true}
  - {platform: resistance, sensor: v4, configuration: UPSTREAM, resistor: 10kOhm, reference_voltage: 3.3V, id: res4, internal: true}
  - platform: ntc
    sensor: res4
    id: t4
    name: "Пол 4 Спальня"
    internal: true
    calibration:   # таблица из паспорта Valtec VT.AC602 (B≈3330, не 3950)
      - 22.07kOhm -> 5°C
      - 12.091kOhm -> 20°C
      - 5.827kOhm -> 40°C
    filters:
      - sliding_window_moving_average: {window_size: 3, send_every: 1}
      - lambda: 'return (x < 5 || x > 45) ? NAN : x;'

  # 5 Коридор (плата 2, A0)
  - {platform: ads1115, ads1115_id: ads2, multiplexer: A0_GND, gain: 4.096, id: v5, update_interval: 15s, internal: true}
  - {platform: resistance, sensor: v5, configuration: UPSTREAM, resistor: 10kOhm, reference_voltage: 3.3V, id: res5, internal: true}
  - platform: ntc
    sensor: res5
    id: t5
    name: "Пол 5 Коридор"
    internal: true
    calibration:   # таблица из паспорта Valtec VT.AC602 (B≈3330, не 3950)
      - 22.07kOhm -> 5°C
      - 12.091kOhm -> 20°C
      - 5.827kOhm -> 40°C
    filters:
      - sliding_window_moving_average: {window_size: 3, send_every: 1}
      - lambda: 'return (x < 5 || x > 45) ? NAN : x;'

  # 6 Ванная (плата 2, A1)
  - {platform: ads1115, ads1115_id: ads2, multiplexer: A1_GND, gain: 4.096, id: v6, update_interval: 15s, internal: true}
  - {platform: resistance, sensor: v6, configuration: UPSTREAM, resistor: 10kOhm, reference_voltage: 3.3V, id: res6, internal: true}
  - platform: ntc
    sensor: res6
    id: t6
    name: "Пол 6 Ванная"
    internal: true
    calibration:   # таблица из паспорта Valtec VT.AC602 (B≈3330, не 3950)
      - 22.07kOhm -> 5°C
      - 12.091kOhm -> 20°C
      - 5.827kOhm -> 40°C
    filters:
      - sliding_window_moving_average: {window_size: 3, send_every: 1}
      - lambda: 'return (x < 5 || x > 45) ? NAN : x;'

  # 7 Туалет (плата 2, A2)
  - {platform: ads1115, ads1115_id: ads2, multiplexer: A2_GND, gain: 4.096, id: v7, update_interval: 15s, internal: true}
  - {platform: resistance, sensor: v7, configuration: UPSTREAM, resistor: 10kOhm, reference_voltage: 3.3V, id: res7, internal: true}
  - platform: ntc
    sensor: res7
    id: t7
    name: "Пол 7 Туалет"
    internal: true
    calibration:   # таблица из паспорта Valtec VT.AC602 (B≈3330, не 3950)
      - 22.07kOhm -> 5°C
      - 12.091kOhm -> 20°C
      - 5.827kOhm -> 40°C
    filters:
      - sliding_window_moving_average: {window_size: 3, send_every: 1}
      - lambda: 'return (x < 5 || x > 45) ? NAN : x;'

  # Время работы с последней перезагрузки: если всё время маленькое — плата перезагружается
  - {platform: uptime, name: "Работает, с", update_interval: 60s}

  - platform: packet_transport
    provider: ekran
    remote_id: set1
    id: set1
    internal: true
    on_value:
      - lambda: |-
          if (!isnan(x) && fabs(id(c1).target_temperature - x) > 0.05) {
            auto call = id(c1).make_call();
            call.set_target_temperature(x);
            call.perform();
          }
  - platform: packet_transport
    provider: ekran
    remote_id: set2
    id: set2
    internal: true
    on_value:
      - lambda: |-
          if (!isnan(x) && fabs(id(c2).target_temperature - x) > 0.05) {
            auto call = id(c2).make_call();
            call.set_target_temperature(x);
            call.perform();
          }
  - platform: packet_transport
    provider: ekran
    remote_id: set3
    id: set3
    internal: true
    on_value:
      - lambda: |-
          if (!isnan(x) && fabs(id(c3).target_temperature - x) > 0.05) {
            auto call = id(c3).make_call();
            call.set_target_temperature(x);
            call.perform();
          }
  - platform: packet_transport
    provider: ekran
