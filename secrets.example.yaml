# Скопируйте этот файл в secrets.yaml (рядом с ним) и впишите свои значения.
# secrets.yaml в GitHub НЕ попадает (см. .gitignore).
wifi_ssid: "имя_вашей_сети"
wifi_password: "пароль_от_wifi"
ap_password: "пароль_точки_доступа_для_настройки"   # минимум 8 символов
# Ключ шифрования связи экрана с Home Assistant (32 байта в base64).
# Получить в PowerShell: [Convert]::ToBase64String((1..32 | % { [byte](Get-Random -Max 256) }))
# Этот же ключ Home Assistant спросит при добавлении устройства «ekran».
api_key_ekran: "вставьте_сюда_ключ_44_символа="
