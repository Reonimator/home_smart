        - obj:
            x: 10
            y: 418
            width: 780
            height: 56
            styles: row_st
            scrollable: false
            widgets:
              - label: {align: LEFT_MID, x: 10, text_font: f_mid, text_color: 0xFFFFFF, text: "Фото при простое, смена"}
              - button:
                  id: b_foto
                  align: RIGHT_MID
                  x: -6
                  width: 150
                  height: 46
                  styles: btn_st
                  widgets:
                    - label: {id: s_foto, align: CENTER, text_font: f_mid, text: "30 с"}
                  on_click:
                    # Выкл -> 10 с -> 30 с -> 1 мин -> 5 мин -> Выкл
                    - lambda: |-
                        int v = id(foto_iv);
                        id(foto_iv) = v <= 0 ? 10 : v < 30 ? 30 : v < 60 ? 60 : v < 300 ? 300 : 0;
                    - script.execute: refresh

