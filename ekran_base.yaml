                  on_click:
                    - lambda: 'id(sleep_min) = std::max(1, id(sleep_min) - 1);'
                    - script.execute: compute
              - label: {id: s_sl, align: RIGHT_MID, x: -90, text_font: f_mid, text_color: 0xFFFFFF, text: ""}
              - button:
                  align: RIGHT_MID
                  x: -6
                  width: 70
                  height: 46
                  styles: btn_st
                  widgets:
