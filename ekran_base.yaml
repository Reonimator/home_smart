                    - script.execute: compute
              - label: {id: s_at, align: RIGHT_MID, x: -90, text_font: f_mid, text_color: 0xFFFFFF, text: ""}
              - button:
                  align: RIGHT_MID
                  x: -6
                  width: 70
                  height: 46
                  styles: btn_st
                  widgets:
                    - label: {align: CENTER, text_font: f_mid, text: "+"}
                  on_click:
                    - lambda: 'id(away_t) = std::min(20.0f, id(away_t) + 0.5f);'
                    - script.execute: compute
        - obj:
            x: 10
            y: 358
            width: 780
            height: 56
            styles: row_st
            scrollable: false
            widgets:
              - label: {align: LEFT_MID, x: 10, text_font: f_mid, text_color: 0xFFFFFF, text: "Гасить экран через"}
              - button:
